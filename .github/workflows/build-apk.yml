name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create www folder
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Quran Companion</title>
          </head>
          <body>
            <script>
              window.location.href = "https://aasimkhaan923-as.github.io/ISLAM-29/";
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aktech.qurancompanion",
            "appName": "Quran Companion",
            "webDir": "www",
            "server": {
              "url": "https://aasimkhaan923-as.github.io/ISLAM-29/",
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
